org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# KSP1: Hilt's aggregating annotation processor is not yet reliably compatible with KSP2
# (open upstream issues google/dagger#4766, google/dagger#4303, google/ksp#1841 — KSP runs
# but the Hilt Gradle plugin's bytecode transform doesn't wire up, failing with "Expected
# @AndroidEntryPoint to have a value"). Leave this unset/false until Hilt fixes it.
ksp.useKSP2=false
