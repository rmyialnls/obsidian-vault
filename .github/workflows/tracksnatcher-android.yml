# Builds the TrackSnatcher Android client and runs its unit tests on every change.
# The Gradle wrapper JAR is intentionally not committed, so we use setup-gradle's
# pinned Gradle instead of ./gradlew.
name: TrackSnatcher Android

on:
  push:
    paths:
      - "TrackSnatcher/**"
      - ".github/workflows/tracksnatcher-android.yml"
  pull_request:
    paths:
      - "TrackSnatcher/**"
      - ".github/workflows/tracksnatcher-android.yml"

concurrency:
  group: tracksnatcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: TrackSnatcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tracksnatcher-debug-apk
          path: TrackSnatcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: TrackSnatcher/app/build/reports/tests/
          if-no-files-found: ignore
